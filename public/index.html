<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cover Page Generator</title>
    <style>
      :root {
        --bg: #f4efe6;
        --panel: #fffdf8;
        --panel-strong: #f0e6d7;
        --text: #1d1a15;
        --muted: #6b6256;
        --accent: #8e4b2c;
        --accent-dark: #6f3317;
        --line: #d7c7b1;
        --shadow: 0 24px 60px rgba(67, 39, 19, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Georgia, "Times New Roman", serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(255, 255, 255, 0.92), transparent 30%),
          linear-gradient(135deg, #efe5d6 0%, #f7f3ec 48%, #e9ddca 100%);
      }

      .page {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .panel {
        width: min(720px, 100%);
        background: var(--panel);
        border: 1px solid rgba(142, 75, 44, 0.14);
        border-radius: 28px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .hero {
        padding: 32px 32px 22px;
        background:
          linear-gradient(120deg, rgba(142, 75, 44, 0.08), rgba(255, 255, 255, 0)),
          var(--panel);
        border-bottom: 1px solid var(--line);
      }

      .eyebrow {
        display: inline-flex;
        padding: 6px 12px;
        border-radius: 999px;
        background: var(--panel-strong);
        color: var(--accent-dark);
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 16px 0 10px;
        font-size: clamp(32px, 5vw, 48px);
        line-height: 0.95;
      }

      .subtext {
        margin: 0;
        max-width: 52ch;
        color: var(--muted);
        font-size: 16px;
      }

      form {
        padding: 28px 32px 32px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .field.full {
        grid-column: 1 / -1;
      }

      label {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.03em;
        color: var(--accent-dark);
        text-transform: uppercase;
      }

      select,
      input,
      button {
        font: inherit;
      }

      select,
      input {
        width: 100%;
        min-height: 52px;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: #fff;
        color: var(--text);
        outline: none;
      }

      select:focus,
      input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px rgba(142, 75, 44, 0.12);
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-top: 24px;
      }

      button {
        min-width: 220px;
        min-height: 56px;
        padding: 14px 22px;
        border: 0;
        border-radius: 16px;
        background: linear-gradient(180deg, #a45430 0%, #7f3a1d 100%);
        color: #fffdf9;
        font-weight: 700;
        cursor: pointer;
        transition: transform 160ms ease, box-shadow 160ms ease, opacity 160ms ease;
        box-shadow: 0 16px 30px rgba(127, 58, 29, 0.24);
      }

      button:hover:not(:disabled) {
        transform: translateY(-1px);
      }

      button:disabled {
        opacity: 0.7;
        cursor: wait;
      }

      .status {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }

      .status.error {
        color: #9a1f15;
      }

      .status.success {
        color: #1d6c3f;
      }

      @media (max-width: 720px) {
        .panel {
          border-radius: 22px;
        }

        .hero,
        form {
          padding-left: 20px;
          padding-right: 20px;
        }

        .grid {
          grid-template-columns: 1fr;
        }

        .actions {
          flex-direction: column;
          align-items: stretch;
        }

        button {
          width: 100%;
          min-width: 0;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="panel">
        <div class="hero">
          <div class="eyebrow">Cover Page</div>
          <h1>Pick. Click. Download.</h1>
          <p class="subtext">
            Choose type, student, course, optional date. Then generate the PDF.
          </p>
        </div>

        <form id="cover-form">
          <div class="grid">
            <div class="field">
              <label for="type">Type</label>
              <select id="type" name="type" required></select>
            </div>

            <div class="field">
              <label for="profile">Student</label>
              <select id="profile" name="profile" required></select>
            </div>

            <div class="field full">
              <label for="course">Course</label>
              <select id="course" name="course" required></select>
            </div>

            <div class="field full">
              <label for="submissionDate">Date (optional)</label>
              <input id="submissionDate" name="submissionDate" type="date" />
            </div>
          </div>

          <div class="actions">
            <button id="generateButton" type="submit">Generate PDF</button>
            <p id="status" class="status">Loading choices...</p>
          </div>
        </form>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
